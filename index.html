<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS- Sales & Master Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Microsoft Authentication Library (MSAL) -->
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- Header / Navigation -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-boxes-packing text-2xl text-amber-400"></i>
                <h1 class="text-xl font-bold tracking-wide">RPS- Sales & Master Portal</h1>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="fetchOneDriveLists()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded transition font-medium flex items-center space-x-1">
                    <i class="fa-solid fa-sync"></i>
                    <span>Login To Microsoft</span>
                </button>
                <span id="roleBadge" class="bg-amber-500 text-slate-900 font-semibold px-3 py-1 rounded-full text-xs uppercase tracking-wider">
                    <i class="fa-solid fa-user-tie mr-1"></i> Salesman Mode
                </span>
                <button id="myobBtn" onclick="toggleMyobMode()" class="bg-teal-600 hover:bg-teal-500 text-white text-xs px-3 py-1.5 rounded transition font-medium border border-teal-400">
                    MYOB Update
                </button>
                <button id="toggleRoleBtn" onclick="toggleRole()" class="bg-indigo-700 hover:bg-indigo-600 text-white text-xs px-3 py-1.5 rounded transition font-medium border border-indigo-500">
                    Switch to Admin
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- LEFT COLUMN: Salesman Entry Form -->
        <div class="lg:col-span-5 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 border-b pb-3 mb-4 flex items-center justify-between">
                <span><i class="fa-solid fa-cart-plus text-indigo-600 mr-2"></i> Log Visit Entry</span>
                <span id="syncStatusText" class="text-xs text-slate-400 font-normal">OneDrive: Disconnected</span>
            </h2>

            <form id="visitForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <!-- Visit Date -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Visit Date</label>
                    <input type="date" id="visitDate" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <!-- Customer Selection -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Customer Name</label>
                    <select id="customer" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">-- Click 'Login To Microsoft' to Load --</option>
                    </select>
                </div>

                <!-- Chargeable -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Chargeable</label>
                    <select id="chargeable" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Line Item Cart Container -->
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                    <label class="block text-xs font-bold uppercase text-indigo-900">Add Products to Visit</label>
                    <div class="grid grid-cols-12 gap-2">
                        <div class="col-span-7">
                            <select id="productSelect" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="">-- Select Product --</option>
                            </select>
                        </div>
                        <div class="col-span-3">
                            <input type="number" id="productQty" min="1" placeholder="Qty" class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div class="col-span-2">
                            <button type="button" onclick="addLineItem()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-1.5 rounded-lg text-sm font-bold transition">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Selected Cart Items Table -->
                    <div class="mt-2 border rounded-lg bg-white overflow-hidden">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-100 border-b text-slate-600">
                                <tr>
                                    <th class="p-2">Product</th>
                                    <th class="p-2 w-16 text-center">Qty</th>
                                    <th class="p-2 w-10 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="cartTableBody" class="divide-y divide-slate-100">
                                <tr><td colspan="3" class="p-3 text-center text-slate-400 italic">No products added yet</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm shadow transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Save Visit Entry to OneDrive</span>
                </button>
            </form>
        </div>

        <!-- RIGHT COLUMN: Staging & Admin View -->
        <div class="lg:col-span-7 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 mb-4 gap-3">
                    <div>
                        <h2 class="text-lg font-bold text-slate-900">App Staging Table</h2>
                        <p class="text-xs text-slate-500">Live entries in OneDrive VisitData sheet</p>
                    </div>

                    <div id="dataEntryControls" class="hidden">
                        <button id="myobUpdateBtn" onclick="updateMyobValues()" disabled class="bg-teal-600 hover:bg-teal-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow transition flex items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span>Update</span>
                        </button>
                    </div>

                    <div id="adminControls" class="hidden">
                        <button id="adminSyncBtn" onclick="syncAndClearMaster()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2 rounded-lg text-xs shadow transition flex items-center space-x-2">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span>Sync to MasterApp_Data.xlsx</span>
                        </button>
                    </div>
                </div>

                <!-- Staging Table -->
                <div class="overflow-x-auto border rounded-lg">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-800 text-white uppercase text-[10px] tracking-wider">
                            <tr>
                                <th class="p-2.5">DATE</th>
                                <th class="p-2.5">CUSTOMER</th>
                                <th class="p-2.5">CHARGEABLE</th>
                                <th class="p-2.5">PRODUCT</th>
                                <th class="p-2.5 text-center">QTY</th>
                                <th id="myobHeader" class="p-2.5 hidden">MYOBUPDATE</th>
                            </tr>
                        </thead>
                        <tbody id="stagingTableBody" class="divide-y divide-slate-200">
                            <!-- Dynamically filled -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Password dialog (masked input; replaces the browser prompt) -->
    <div id="pwdModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center px-4">
        <form id="pwdForm" class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 space-y-4">
            <h3 id="pwdTitle" class="text-base font-bold text-slate-900"></h3>
            <input type="password" id="pwdInput" autocomplete="off" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Password">
            <div class="flex justify-end space-x-2">
                <button type="button" id="pwdCancel" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100 transition">Cancel</button>
                <button type="submit" class="px-4 py-2 rounded-lg text-xs font-bold bg-indigo-700 hover:bg-indigo-600 text-white transition">OK</button>
            </div>
        </form>
    </div>

    <script>
        // --- 1. MSAL CONFIGURATION ---
        const msalConfig = {
            auth: {
                clientId: "570314e5-83d8-4908-b41d-e9a3e1af7731",
                authority: "https://login.microsoftonline.com/common",
                redirectUri: "https://leogayan6841.github.io/sales-portal/"
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);
        let accessToken = null;

        // --- 2. DATA STRUCTURES ---
        let currentRole = "salesman";
        let cartItems = [];
        let stagingData = [];
        let pendingMyob = {}; // staging row index -> "Yes" | "No" chosen in MYOB Update mode, not yet saved

        document.getElementById('visitDate').valueAsDate = new Date();

        function formatDateDisplay(dateStr) {
            if (!dateStr) return "";
            if (typeof dateStr !== "string") return dateStr;
            if (dateStr.includes("/")) return dateStr;
            const parts = dateStr.split("-");
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateStr;
        }

        // --- 3. GET ACCESSTOKEN WITH WRITE SCOPES ---
        async function getAccessToken() {
            if (accessToken) return accessToken;
            const loginResponse = await msalInstance.loginPopup({
                scopes: ["Files.ReadWrite.All"]
            });
            accessToken = loginResponse.accessToken;
            return accessToken;
        }

        // --- 4. FETCH CUSTOMERS & PRODUCTS FROM ONEDRIVE ---
        async function fetchOneDriveLists() {
            const statusText = document.getElementById("syncStatusText");
            try {
                statusText.innerText = "OneDrive: Connecting...";
                accessToken = null;
                const token = await getAccessToken();
                const headers = { Authorization: `Bearer ${token}` };

                // A. Fetch Customer Names
                const custRes = await fetch(
                    "https://graph.microsoft.com/v1.0/me/drive/root:/App_Data.xlsx:/workbook/worksheets('CustomerTable')/usedRange", 
                    { headers }
                );
                const custData = await custRes.json();
                const custSelect = document.getElementById("customer");
                custSelect.innerHTML = '<option value="">-- Select Customer --</option>';
                if (custData.values && custData.values.length > 1) {
                    for (let i = 1; i < custData.values.length; i++) {
                        const customerName = custData.values[i][0];
                        if (customerName) {
                            custSelect.innerHTML += `<option value="${customerName}">${customerName}</option>`;
                        }
                    }
                }

                // B. Fetch Product Names
                const prodRes = await fetch(
                    "https://graph.microsoft.com/v1.0/me/drive/root:/App_Data.xlsx:/workbook/worksheets('ProductTable')/usedRange", 
                    { headers }
                );
                const prodData = await prodRes.json();
                const prodSelect = document.getElementById("productSelect");
                prodSelect.innerHTML = '<option value="">-- Select Product --</option>';
                if (prodData.values && prodData.values.length > 1) {
                    for (let i = 1; i < prodData.values.length; i++) {
                        const productName = prodData.values[i][0];
                        if (productName) {
                            prodSelect.innerHTML += `<option value="${productName}">${productName}</option>`;
                        }
                    }
                }

                // C. Load Existing VisitData Table
                await fetchStagingFromOneDrive();

                statusText.innerText = "OneDrive: Connected";
                statusText.className = "text-xs text-emerald-600 font-semibold";

            } catch (err) {
                console.error("OneDrive Fetch Error:", err);
                statusText.innerText = "OneDrive: Sync Failed";
                statusText.className = "text-xs text-red-500 font-semibold";
                alert("Failed to load lists from OneDrive. Check browser console.");
            }
        }

        // --- 5. FETCH STAGING ROWS FROM ONEDRIVE ---
        async function fetchStagingFromOneDrive() {
            try {
                const token = await getAccessToken();
                const res = await fetch(
                    "https://graph.microsoft.com/v1.0/me/drive/root:/App_Data.xlsx:/workbook/tables('VisitData')/rows",
                    { headers: { Authorization: `Bearer ${token}` } }
                );
                const data = await res.json();
                stagingData = [];
                pendingMyob = {};
                if (data.value) {
                    data.value.forEach(row => {
                        const v = row.values[0];
                        stagingData.push({
                            visitDate: formatDateDisplay(v[0]), // Index 0: VisitDate
                            customer: v[1] || "",               // Index 1: Customer
                            chargeable: v[2] || "",             // Index 2: Chargeable
                            product: v[3] || "",                // Index 3: Product
                            qty: v[4] || 0,                     // Index 4: Qty
                            myob: v[5] || "",                   // Index 5: MYOBUpdate (Admin / MYOB Update modes)
                            raw: v                              // Original row values, used to verify rows before updating
                        });
                    });
                }
                renderStagingTable();
            } catch (e) {
                console.log("Staging load error or table empty:", e);
            }
        }

        // --- 6. SUBMIT SALESMAN ENTRY & POST TO ONEDRIVE ---
        async function handleFormSubmit(e) {
            e.preventDefault();
            if (cartItems.length === 0) {
                alert("Please add at least one product line item before saving.");
                return;
            }

            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.innerText = "Saving to OneDrive...";

            const rawVisitDate = document.getElementById("visitDate").value;
            const formattedDate = formatDateDisplay(rawVisitDate);
            const customer = document.getElementById("customer").value;
            const chargeable = document.getElementById("chargeable").value;

            const rowsToInsert = cartItems.map(item => [
                formattedDate, // Index 0: VisitDate
                customer,      // Index 1: Customer
                chargeable,    // Index 2: Chargeable
                item.product,  // Index 3: Product
                item.qty,      // Index 4: Qty
                ""             // Index 5: MYOBUpdate
            ]);

            try {
                const token = await getAccessToken();
                
                const response = await fetch(
                    "https://graph.microsoft.com/v1.0/me/drive/root:/App_Data.xlsx:/workbook/tables('VisitData')/rows/add",
                    {
                        method: "POST",
                        headers: {
                            Authorization: `Bearer ${token}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ values: rowsToInsert })
                    }
                );

                if (!response.ok) {
                    const errRes = await response.json();
                    console.error("Microsoft Graph Error Details:", errRes);
                    throw new Error("Failed to write to OneDrive: " + (errRes.error ? errRes.error.message : "Unknown error"));
                }

                // Reset form fields immediately on success (before the blocking alert)
                document.getElementById("visitDate").valueAsDate = new Date();
                document.getElementById("customer").value = "";
                document.getElementById("chargeable").value = "Yes";
                cartItems = [];
                renderCart();

                alert("Visit entry saved directly to OneDrive App_Data.xlsx!");

                // Refresh Staging Table
                await fetchStagingFromOneDrive();

            } catch (err) {
                console.error("OneDrive Save Error:", err);
                alert("Error saving to OneDrive: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i><span>Save Visit Entry to OneDrive</span>';
            }
        }

        // --- 7. CART MANAGEMENT ---
        function addLineItem() {
            const prod = document.getElementById("productSelect").value;
            const qty = document.getElementById("productQty").value;

            if (!prod || !qty || qty <= 0) {
                alert("Please select a product and enter a valid quantity.");
                return;
            }

            cartItems.push({ product: prod, qty: parseInt(qty) });
            document.getElementById("productSelect").value = "";
            document.getElementById("productQty").value = "";
            renderCart();
        }

        function removeCartItem(index) {
            cartItems.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById("cartTableBody");
            if (cartItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-3 text-center text-slate-400 italic">No products added yet</td></tr>`;
                return;
            }
            tbody.innerHTML = cartItems.map((item, idx) => `
                <tr>
                    <td class="p-2 font-medium text-slate-800">${item.product}</td>
                    <td class="p-2 text-center font-bold">${item.qty}</td>
                    <td class="p-2 text-center">
                        <button onclick="removeCartItem(${idx})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                </tr>
            `).join("");
        }

        // --- 8. RENDER STAGING TABLE ---
        function renderStagingTable() {
            const tbody = document.getElementById("stagingTableBody");
            const showMyob = currentRole === "admin" || currentRole === "dataentry";
            const canEditMyob = currentRole === "dataentry";
            document.getElementById("myobHeader").classList.toggle("hidden", !showMyob);

            if (stagingData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${showMyob ? 6 : 5}" class="p-4 text-center text-slate-400 italic">No entries in staging table</td></tr>`;
                refreshMyobUpdateButton();
                return;
            }

            tbody.innerHTML = stagingData.map((row, idx) => {
                let myobCell = "";
                if (canEditMyob) {
                    const selected = pendingMyob[idx] !== undefined ? pendingMyob[idx] : row.myob;
                    myobCell = `<td class="p-2.5">
                        <select onchange="onMyobChange(${idx}, this.value)" class="border border-slate-300 rounded px-2 py-1 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none">
                            ${selected !== "Yes" && selected !== "No" ? '<option value="" selected>-- Select --</option>' : ""}
                            <option value="Yes"${selected === "Yes" ? " selected" : ""}>Yes</option>
                            <option value="No"${selected === "No" ? " selected" : ""}>No</option>
                        </select>
                    </td>`;
                } else if (showMyob) {
                    myobCell = `<td class="p-2.5">${row.myob}</td>`;
                }
                return `
                <tr class="hover:bg-slate-50">
                    <td class="p-2.5 font-medium">${row.visitDate}</td>
                    <td class="p-2.5">${row.customer}</td>
                    <td class="p-2.5">${row.chargeable}</td>
                    <td class="p-2.5 font-semibold text-indigo-900">${row.product}</td>
                    <td class="p-2.5 text-center font-bold">${row.qty}</td>
                    ${myobCell}
                </tr>`;
            }).join("");
            refreshMyobUpdateButton();
        }

        // Tracks Yes/No choices made in the MYOBUpdate column (MYOB Update mode) until "Update" is clicked
        function onMyobChange(idx, value) {
            if (value === "" || value === stagingData[idx].myob) {
                delete pendingMyob[idx];
            } else {
                pendingMyob[idx] = value;
            }
            refreshMyobUpdateButton();
        }

        function refreshMyobUpdateButton() {
            document.getElementById("myobUpdateBtn").disabled = Object.keys(pendingMyob).length === 0;
        }

        // --- 9. ROLE SWITCHING ---
        // Reads App_Data.xlsx -> AccessTable and returns the passwords of all rows matching the given Role ("Admin" or "DataEntry")
        async function fetchRolePasswords(role) {
            const token = await getAccessToken();
            const res = await fetch(
                "https://graph.microsoft.com/v1.0/me/drive/root:/App_Data.xlsx:/workbook/tables('AccessTable')/range",
                { headers: { Authorization: `Bearer ${token}` } }
            );
            if (!res.ok) {
                throw new Error("Could not read AccessTable from App_Data.xlsx (HTTP " + res.status + ")");
            }
            const values = (await res.json()).values || [];
            const header = (values[0] || []).map(h => String(h).trim().toLowerCase());
            const roleCol = header.indexOf("role");
            const passCol = header.indexOf("password");
            if (roleCol < 0 || passCol < 0) {
                throw new Error("AccessTable needs 'Role' and 'Password' column headers.");
            }
            return values.slice(1)
                .filter(r => String(r[roleCol]).trim().toLowerCase() === role.toLowerCase())
                .map(r => String(r[passCol]))
                .filter(p => p !== "");
        }

        // Shows the masked password dialog; resolves with the typed password, or null if cancelled
        function askPassword(title) {
            return new Promise(resolve => {
                const modal = document.getElementById("pwdModal");
                const form = document.getElementById("pwdForm");
                const input = document.getElementById("pwdInput");
                document.getElementById("pwdTitle").innerText = title;
                input.value = "";
                modal.classList.remove("hidden");
                input.focus();

                const finish = value => {
                    modal.classList.add("hidden");
                    input.value = "";
                    form.removeEventListener("submit", onSubmit);
                    document.getElementById("pwdCancel").removeEventListener("click", onCancel);
                    document.removeEventListener("keydown", onKey);
                    resolve(value);
                };
                const onSubmit = e => { e.preventDefault(); finish(input.value); };
                const onCancel = () => finish(null);
                const onKey = e => { if (e.key === "Escape") finish(null); };

                form.addEventListener("submit", onSubmit);
                document.getElementById("pwdCancel").addEventListener("click", onCancel);
                document.addEventListener("keydown", onKey);
            });
        }

        // Verifies the user against AccessTable (Role = sheetRole) with a masked password dialog; returns true when allowed
        async function authenticateRole(sheetRole, label) {
            const buttons = [document.getElementById("toggleRoleBtn"), document.getElementById("myobBtn")];
            buttons.forEach(b => b.disabled = true);
            let passwords;
            try {
                passwords = await fetchRolePasswords(sheetRole);
            } catch (err) {
                console.error(`${label} password lookup error:`, err);
                alert(`Could not verify ${label} access: ` + err.message);
                return false;
            } finally {
                buttons.forEach(b => b.disabled = false);
            }
            if (passwords.length === 0) {
                alert(`No ${label} password is set in AccessTable.`);
                return false;
            }

            const pwd = await askPassword(`Enter ${label} Password`);
            if (pwd === null) return false;
            if (!passwords.includes(pwd)) {
                alert("Incorrect Password!");
                return false;
            }
            return true;
        }

        // Applies the UI for a role: "salesman", "admin" or "dataentry" (MYOB Update mode)
        function setRole(role) {
            currentRole = role;
            pendingMyob = {};
            const badge = document.getElementById("roleBadge");
            const toggleBtn = document.getElementById("toggleRoleBtn");
            const myobBtn = document.getElementById("myobBtn");

            if (role === "admin") {
                badge.className = "bg-purple-600 text-white font-semibold px-3 py-1 rounded-full text-xs uppercase tracking-wider";
                badge.innerHTML = '<i class="fa-solid fa-user-gear mr-1"></i> Admin Mode';
            } else if (role === "dataentry") {
                badge.className = "bg-teal-600 text-white font-semibold px-3 py-1 rounded-full text-xs uppercase tracking-wider";
                badge.innerHTML = '<i class="fa-solid fa-keyboard mr-1"></i> MYOB Update Mode';
            } else {
                badge.className = "bg-amber-500 text-slate-900 font-semibold px-3 py-1 rounded-full text-xs uppercase tracking-wider";
                badge.innerHTML = '<i class="fa-solid fa-user-tie mr-1"></i> Salesman Mode';
            }

            toggleBtn.innerText = role === "admin" ? "Switch to Salesman" : "Switch to Admin";
            myobBtn.innerText = role === "dataentry" ? "Exit MYOB Update" : "MYOB Update";
            document.getElementById("adminControls").classList.toggle("hidden", role !== "admin");
            document.getElementById("dataEntryControls").classList.toggle("hidden", role !== "dataentry");
            renderStagingTable();
        }

        async function toggleRole() {
            if (currentRole === "admin") {
                setRole("salesman");
            } else if (await authenticateRole("Admin", "Admin")) {
                setRole("admin");
            }
        }

        async function toggleMyobMode() {
            if (currentRole === "dataentry") {
                setRole("salesman");
            } else if (await authenticateRole("DataEntry", "Data Entry")) {
                setRole("dataentry");
            }
        }

        // --- 9b. SAVE MYOBUPDATE VALUES (MYOB Update mode) ---
        async function updateMyobValues() {
            const changes = Object.entries(pendingMyob).map(([i, value]) => [Number(i), value]);
            if (changes.length === 0) return;

            const btn = document.getElementById("myobUpdateBtn");
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Updating...</span>';

            try {
                const token = await getAccessToken();
                const base = "https://graph.microsoft.com/v1.0/me/drive/root:/App_Data.xlsx:/workbook/tables('VisitData')/rows";

                // Re-read the live rows and make sure each row to update is still the one shown on screen
                const res = await fetch(base, { headers: { Authorization: `Bearer ${token}` } });
                if (!res.ok) {
                    throw new Error("Could not read VisitData from App_Data.xlsx (HTTP " + res.status + ")");
                }
                const liveRows = (await res.json()).value || [];
                for (const [i] of changes) {
                    const live = liveRows[i] && liveRows[i].values[0];
                    if (!live || JSON.stringify(live.slice(0, 5)) !== JSON.stringify(stagingData[i].raw.slice(0, 5))) {
                        await fetchStagingFromOneDrive();
                        throw new Error("VisitData changed since it was loaded. The table was refreshed - please choose the values again.");
                    }
                }

                let saved = 0;
                for (const [i, value] of changes) {
                    const rowValues = [...liveRows[i].values[0]];
                    rowValues[5] = value; // Index 5: MYOBUpdate
                    const patchRes = await fetch(`${base}/itemAt(index=${i})`, {
                        method: "PATCH",
                        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ values: [rowValues] })
                    });
                    if (!patchRes.ok) {
                        await fetchStagingFromOneDrive();
                        throw new Error(`Saved ${saved} of ${changes.length} rows; saving row ${i + 1} failed (HTTP ${patchRes.status}).`);
                    }
                    saved++;
                }

                alert(`MYOBUpdate saved for ${saved} row(s).`);
                await fetchStagingFromOneDrive();
            } catch (err) {
                console.error("MYOB Update Error:", err);
                alert("Error updating MYOBUpdate: " + err.message);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i><span>Update</span>';
                refreshMyobUpdateButton();
            }
        }

        // --- 10. ADMIN SYNC & DIRECT TRANSFER TO MASTERAPP_DATA.XLSX ---
        async function syncAndClearMaster() {
            const btn = document.getElementById("adminSyncBtn");
            try {
                const token = await getAccessToken();
                const headers = { 
                    Authorization: `Bearer ${token}`,
                    "Content-Type": "application/json"
                };

                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Transferring Data...</span>';

                // Step 1: Read current rows from App_Data.xlsx -> VisitData table
                const res = await fetch(
                    "https://graph.microsoft.com/v1.0/me/drive/root:/App_Data.xlsx:/workbook/tables('VisitData')/rows",
                    { headers: { Authorization: `Bearer ${token}` } }
                );
                if (!res.ok) {
                    throw new Error("Could not read VisitData from App_Data.xlsx (HTTP " + res.status + ")");
                }
                const data = await res.json();

                if (!data.value || data.value.length === 0) {
                    alert("No data rows found in VisitData table to transfer.");
                    return;
                }

                // Extract row values
                const rawRows = data.value.map(row => row.values[0]);

                // Step 2: Post rows directly into MasterApp_Data.xlsx -> MasterData table
                const masterBase = "https://graph.microsoft.com/v1.0/me/drive/root:/MasterApp_Data.xlsx:/workbook";
                let masterRes = await fetch(`${masterBase}/tables('MasterData')/rows/add`, {
                    method: "POST",
                    headers,
                    body: JSON.stringify({ values: rawRows })
                });

                // Fallback only when no 'MasterData' Excel Table exists: append below the worksheet's usedRange
                if (masterRes.status === 404) {
                    const usedRes = await fetch(`${masterBase}/worksheets('MasterData')/usedRange(valuesOnly=true)`, { headers });
                    if (!usedRes.ok) {
                        throw new Error("Could not read worksheet 'MasterData' in MasterApp_Data.xlsx (HTTP " + usedRes.status + ")");
                    }
                    const used = await usedRes.json();
                    const sheetIsEmpty = used.values.every(r => r.every(c => c === ""));
                    const startRow = sheetIsEmpty ? used.rowIndex + 1 : used.rowIndex + used.rowCount + 1;
                    const colName = n => { let s = ""; for (n += 1; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + (n - 1) % 26) + s; return s; };
                    const address = `${colName(used.columnIndex)}${startRow}:${colName(used.columnIndex + rawRows[0].length - 1)}${startRow + rawRows.length - 1}`;

                    masterRes = await fetch(`${masterBase}/worksheets('MasterData')/range(address='${address}')`, {
                        method: "PATCH",
                        headers,
                        body: JSON.stringify({ values: rawRows })
                    });
                }

                if (!masterRes.ok) {
                    const errPayload = await masterRes.json();
                    throw new Error("Failed writing to MasterApp_Data.xlsx: " + (errPayload.error ? errPayload.error.message : "Unknown error"));
                }

                // Step 3: Delete rows from App_Data.xlsx -> VisitData table in reverse index order
                const rowCount = data.value.length;
                for (let i = rowCount - 1; i >= 0; i--) {
                    const delRes = await fetch(
                        `https://graph.microsoft.com/v1.0/me/drive/root:/App_Data.xlsx:/workbook/tables('VisitData')/rows/$/itemAt(index=${i})`,
                        {
                            method: "DELETE",
                            headers: { Authorization: `Bearer ${token}` }
                        }
                    );
                    if (!delRes.ok) {
                        await fetchStagingFromOneDrive();
                        throw new Error(`Rows were copied to MasterApp_Data.xlsx, but clearing VisitData stopped at row ${i + 1} (HTTP ${delRes.status}). ${rowCount - 1 - i} of ${rowCount} rows were cleared. Remove the remaining rows manually before syncing again to avoid duplicates.`);
                    }
                }

                alert(`Successfully transferred ${rowCount} records to MasterApp_Data.xlsx and cleared the VisitData table!`);

                // Refresh Staging Table UI
                await fetchStagingFromOneDrive();

            } catch (err) {
                console.error("Master Sync Error:", err);
                alert("Error during master sync: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i><span>Sync to MasterApp_Data.xlsx</span>';
            }
        }

        renderStagingTable();
    </script>
